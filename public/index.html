<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>欲言信箱</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%233a6b4f' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z'/></svg>" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="site-header">
      <div class="header-inner">
        <div class="brand">
          <span class="brand-emoji">📮</span>
          <div>
            <h1>欲言信箱</h1>
            <p class="tagline">你所有未说出口的话，都值得被听见。</p>
          </div>
        </div>
        <div class="header-actions">
          <a id="meBtn" class="me-btn" href="me.html#notifications">
            个人中心
            <span id="notifBadge" class="notif-badge hidden">0</span>
          </a>
        </div>
      </div>
  </header>

  <main class="container">
    <!-- 提问入口（收起态） -->
    <section class="ask-cta card">
      <div class="ask-cta-text">
        <span class="ask-cta-title">有话想说？</span>
        <span class="ask-cta-sub">匿名、自由、被温柔倾听 ✦ 你所有未说出口的话，都值得被听见。</span>
      </div>
      <button id="askOpenBtn" class="ask-open-btn">＋ 我要提问</button>
    </section>

    <!-- 提问弹窗 -->
    <div id="askModal" class="modal hidden" aria-hidden="true">
      <div class="modal-backdrop" data-close="1"></div>
      <div class="modal-card composer" role="dialog" aria-modal="true" aria-label="我要提问">
        <div class="modal-head">
          <div class="composer-head">
            <span class="anon-badge">匿名提问</span>
            <span class="hint">不记录任何身份信息</span>
          </div>
          <button id="askCloseBtn" class="modal-close" title="关闭">✕</button>
        </div>
        <input id="titleInput" class="title-input" type="text" maxlength="15" placeholder="一句话概括你的问题（标题，可选）" />
        <textarea id="contentInput" class="content-input" maxlength="2000" rows="4" placeholder="选一个话题吧，它会帮你找到更懂你的人…"></textarea>
        <div class="composer-foot">
          <div class="select-wrap">
            <select id="categoryInput" class="category-select"></select>
          </div>
          <div class="composer-right">
            <span id="charCount" class="char-count">0/2000</span>
            <button id="postBtn" class="primary-btn">发布</button>
          </div>
        </div>
        <p id="composerMsg" class="composer-msg"></p>
      </div>
    </div>

    <!-- 搜索 -->
    <section class="toolbar">
      <div class="search-wrap">
        <span class="search-ico"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></span>
        <input id="searchInput" class="search-input" type="text" placeholder="搜索关键词，关联到相关问题…" />
      </div>
    </section>

    <!-- 卡片双列 -->
    <section class="feed">
      <div class="feed-head">
        <div class="filter-all">
          <button id="allBtn" class="pill all-pill">全部 <span class="caret">▾</span></button>
          <div id="catDropdown" class="cat-dropdown hidden"></div>
          <button id="featuredBtn" class="pill featured-pill"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg> 精选</button>
        </div>
        <div class="feed-head-right">
          <div class="sort-toggle">
            <button id="sortTime" class="sort-btn active">时间</button>
            <button id="sortHeat" class="sort-btn">热度</button>
          </div>
          <button id="refreshBtn" class="ghost-btn small">↻ 刷新</button>
        </div>
      </div>
      <div id="questionList" class="question-list"></div>
    </section>
  </main>

  <footer class="site-footer">
    <p class="footer-line1"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>人格成长·欲言信箱</p>
    <p class="footer-line2">所有发言均匿名 · 请友善交流</p>
  </footer>

  <div id="adminMenu" class="admin-menu hidden"></div>
  <div id="toast" class="toast hidden"></div>
  <script>window.API_BASE = 'https://1341046552-e0dvq4j6et.ap-guangzhou.tencentscf.com';</script>
  <script src="icons.js"></script>
  <script src="identity.js"></script>
  <script src="app.js"></script>
</body>
</html>
