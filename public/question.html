<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>欲言信箱 · 问题详情</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%233a6b4f' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z'/></svg>" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="site-header detail-header">
    <div class="header-inner">
      <a href="index.html" class="back-link">← 欲言信箱</a>
    </div>
  </header>

  <main class="container detail-container">
    <article id="questionView" class="question-view card">
      <div class="q-top">
        <span id="qCat" class="post-topic">#其他</span>
        <button id="qDel" class="del-btn hidden"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg> 删除我的问题</button>
      </div>
      <h1 id="qTitle" class="q-title"></h1>
      <div id="qAuthor" class="q-author"></div>
      <p id="qDate" class="q-date"></p>
      <p id="qContent" class="q-content"></p>
    </article>

    <section class="reply-composer card">
      <div class="composer-head">
        <span class="anon-badge">匿名回复</span>
        <span class="hint">写下你的思考或回应</span>
      </div>
      <div id="replyQuote" class="reply-quote-preview hidden">
        <div class="rq-text"></div>
        <button id="replyQuoteCancel" class="rq-cancel" type="button">✕</button>
      </div>
      <textarea id="replyInput" class="content-input" maxlength="4000" rows="3" placeholder="对此问题，你想说点什么…"></textarea>
      <div class="composer-right" style="margin-top:10px;">
        <span id="replyCount" class="char-count">0 条回复</span>
        <button id="replyBtn" class="primary-btn">留言</button>
      </div>
      <p id="replyMsg" class="composer-msg"></p>
    </section>

    <section class="replies">
      <h2 class="replies-title">回复 <span id="repliesNum">0</span></h2>
      <div id="replyList" class="reply-list"></div>
      <div id="replyEmpty" class="empty-tip">还没有回复，来做第一个回应的人 🌱</div>
    </section>
  </main>

  <div id="toast" class="toast hidden"></div>
  <script src="icons.js"></script>
  <script src="identity.js"></script>
  <script src="detail.js"></script>
</body>
</html>
